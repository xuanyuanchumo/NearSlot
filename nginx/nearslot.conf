# NearSlot 前后端分离部署（ADR-015）：Nginx 托管前端静态资源 + 反代 /api
upstream nearslot_backend {
    server nearslot-app:8081;
    keepalive 32;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 前端 SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端 API 反代（保留 /api 前缀，后端控制器映射 /api/v1/**）
    location /api/ {
        proxy_pass http://nearslot_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
    }

    # SSE 流式（AI 对话）：关闭缓冲，长连接
    location /api/v1/agent/stream {
        proxy_pass http://nearslot_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 3600s;
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # 健康检查
    location /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
