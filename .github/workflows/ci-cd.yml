# NearSlot CI（G0 治理门禁 → G4 测试门禁）
#
# 2026-11-18 修复（首次推送后实测暴露）：
# 1. 路径全部改为**仓库根相对**：原工作流写的是 `NearSlot/docs/**`、`cd NearSlot`，
#    那是"父目录为仓库根"的假设；实际仓库根就是 NearSlot 本身 → 所有 job 必然找不到文件。
# 2. 补 `permissions: pull-requests: read`：dorny/paths-filter 在 PR 上读变更文件列表需要该权限，
#    缺失时报 "Resource not accessible by integration"，`changes` job 直接失败 → 后续全部 skipped。
#    这意味着**该流水线此前从未真正运行过**（仓库无 remote，pull_request 事件不可能触发）。
# 3. contract / integration 两个 job 需要真实中间件：改为 GitHub Actions `services` 容器，
#    并对空库执行 sql/01..13（幂等脚本，ADR-032）。
name: nearslot-ci

on:
  push: { branches: [main, develop] }
  pull_request: {}

permissions:
  contents: read
  pull-requests: read

env:
  MYSQL_HOST: 127.0.0.1
  MYSQL_PORT: "43306"
  MYSQL_USER: nearslot
  MYSQL_PASSWORD: ci-mysql-pass
  MYSQL_DATABASE: nearslot
  REDIS_HOST: 127.0.0.1
  REDIS_PASSWORD: ci-redis-pass
  RABBITMQ_HOST: 127.0.0.1
  RABBITMQ_USER: nearslot
  RABBITMQ_PASSWORD: ci-rabbit-pass
  JWT_SECRET: ci-jwt-secret-at-least-32-bytes-long-0123456789

# 说明：docs/ 是**独立的私有 git 仓库**（xuanyuanchumo/NearSlot-docs），
# 不在本仓库内（.gitignore 第 58 行），因此本流水线不再承担文档门禁 ——
# 文档校验由 .husky/pre-commit 在本地执行；文档仓库独立 CI 见 backlog BL-PROC-06。
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - name: 编译 + 单测（排除 integration 标签）
        run: mvn -B compile test -DexcludedGroups=integration
      - name: 覆盖率门槛（G4：行覆盖 ≥ 80%）
        run: |
          python3 - <<'PY'
          import csv, glob, os, sys
          tot=[0,0]; br=[0,0]; rows=[]
          for f in glob.glob('*/target/site/jacoco/jacoco.csv'):
              m=f.split(os.sep)[0]; lc=lm=bc=bm=0
              with open(f, encoding='utf-8') as fh:
                  for r in csv.DictReader(fh):
                      lc+=int(r['LINE_COVERED']); lm+=int(r['LINE_MISSED'])
                      bc+=int(r['BRANCH_COVERED']); bm+=int(r['BRANCH_MISSED'])
              tot[0]+=lc; tot[1]+=lc+lm; br[0]+=bc; br[1]+=bc+bm
              rows.append((m, lc, lc+lm))
          for m, c, t in rows:
              print(f"{m:30s} {0 if t==0 else round(100*c/t,1)}%")
          line = 0 if tot[1]==0 else round(100*tot[0]/tot[1],1)
          print(f"合计行覆盖 {line}% ({tot[0]}/{tot[1]})")
          THRESHOLD = 80.0
          if line < THRESHOLD:
              print(f"::error::行覆盖率 {line}% 低于 G4 门槛 {THRESHOLD}%")
              sys.exit(1)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as s:
              s.write(f"## 覆盖率\n\n行覆盖 **{line}%**（{tot[0]}/{tot[1]}）\n")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-reports
          path: '*/target/site/jacoco/'
          retention-days: 7

  # 契约门禁（ADR-018）：起应用生成 OpenAPI，检测破坏性变更
  contract:
    needs: [build]
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-root-pass
          MYSQL_DATABASE: nearslot
          MYSQL_USER: nearslot
          MYSQL_PASSWORD: ci-mysql-pass
        ports: ["43306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pci-root-pass"
          --health-interval 10s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        command: ["redis-server", "--requirepass", "ci-redis-pass"]
        ports: ["46379:6379"]
        options: >-
          --health-cmd "redis-cli -a ci-redis-pass ping"
          --health-interval 10s --health-timeout 5s --health-retries 20
      rabbitmq:
        image: rabbitmq:3.13-alpine
        env:
          RABBITMQ_DEFAULT_USER: nearslot
          RABBITMQ_DEFAULT_PASS: ci-rabbit-pass
        ports: ["45672:5672"]
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 15s --health-timeout 10s --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - name: 初始化数据库（应用启动需要表结构）
        run: |
          for f in $(ls sql/*.sql | sort); do
            echo "apply $f"
            mysql -h127.0.0.1 -P43306 -unearslot -pci-mysql-pass nearslot < "$f"
          done
      - name: 启动应用生成 OpenAPI
        run: |
          mvn -B -q -DskipTests package
          java -jar nearslot-app/target/nearslot-app-*.jar \
            --spring.profiles.active=verify > /tmp/app.log 2>&1 &
          for i in $(seq 1 90); do
            if curl -sf http://localhost:8081/v3/api-docs -o /tmp/openapi.json; then break; fi
            sleep 2
          done
          if [ ! -s /tmp/openapi.json ]; then echo "::error::应用未启动，无法生成契约"; tail -50 /tmp/app.log; exit 1; fi
          mkdir -p api
          python3 -c "import json;d=json.load(open('/tmp/openapi.json'));json.dump(d,open('api/openapi.json','w'),ensure_ascii=False,indent=2,sort_keys=True)"
      - name: 破坏性变更检测
        run: |
          if git cat-file -e HEAD:api/openapi.json 2>/dev/null; then
            python3 - <<'PY'
          import json, subprocess, sys
          old = json.loads(subprocess.run(['git','show','HEAD:api/openapi.json'],
                                          capture_output=True, text=True).stdout or '{}')
          new = json.load(open('api/openapi.json'))
          breaking = []
          for path, methods in (old.get('paths') or {}).items():
              if path not in (new.get('paths') or {}):
                  breaking.append(f"删除路径 {path}")
                  continue
              for m in methods:
                  if m not in new['paths'][path]:
                      breaking.append(f"删除方法 {m.upper()} {path}")
          if breaking:
              print("检测到破坏性变更，必须升 /api/v{N+1}：")
              for b in breaking: print(" -", b)
              sys.exit(1)
          print("契约变更非破坏性（仅新增/描述调整）")
          PY
          else
            echo "首次生成 api/openapi.json（基线）"
          fi
      - name: 契约需随 PR 入库
        run: |
          git add api/openapi.json
          if git diff --cached --quiet; then
            echo "契约无变更"
          else
            echo "::warning::契约有变更，请随本 PR 提交 api/openapi.json"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: app-log-contract, path: /tmp/app.log, retention-days: 3 }

  integration:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-root-pass
          MYSQL_DATABASE: nearslot
          MYSQL_USER: nearslot
          MYSQL_PASSWORD: ci-mysql-pass
        ports: ["43306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pci-root-pass"
          --health-interval 10s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        command: ["redis-server", "--requirepass", "ci-redis-pass"]
        ports: ["46379:6379"]
        options: >-
          --health-cmd "redis-cli -a ci-redis-pass ping"
          --health-interval 10s --health-timeout 5s --health-retries 20
      rabbitmq:
        image: rabbitmq:3.13-alpine
        env:
          RABBITMQ_DEFAULT_USER: nearslot
          RABBITMQ_DEFAULT_PASS: ci-rabbit-pass
        ports: ["45672:5672"]
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 15s --health-timeout 10s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - name: 初始化数据库
        run: |
          for f in $(ls sql/*.sql | sort); do
            echo "apply $f"; mysql -h127.0.0.1 -P43306 -unearslot -pci-mysql-pass nearslot < "$f"
          done
      - name: 集成测试（真实 MySQL/Redis/RabbitMQ）
        run: |
          mvn -B verify -Dgroups=integration \
            -Dnearslot.test.redis.host=127.0.0.1 \
            -Dnearslot.test.redis.port=46379 \
            -Dnearslot.test.redis.password=ci-redis-pass

  build-image:
    needs: [build, integration]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "镜像构建占位（Phase 5 接入 ACR；BL-DEP-01）"

  notify:
    needs: [build, contract]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: echo "webhook 通知占位（未配置则跳过）"
