# NearSlot CI（G0 治理门禁 → G4 测试门禁）
#
# 修复历史：
#  - 首次推送暴露：路径需仓库根相对、补 pull-requests: read 权限、services 不支持 command 键。
#  - 评审 BLOCKER-1：integration job 只加 -Dgroups=integration 会跑 0 用例却 BUILD SUCCESS
#    （pom 默认 excludedGroups=integration）。必须 -Pintegration + 断言用例数 > 0。
#  - 评审 MAJOR-3：build-image 原 needs:[build,integration] 但 integration 只在 develop 触发，
#    在 main 上永远 skipped → build-image 永不执行。改为只依赖 build。
#  - 评审：契约变更只打印 warning = 假门禁，改为 ::error:: + exit 1。
name: nearslot-ci

on:
  push: { branches: [main, develop] }
  pull_request: {}

permissions:
  contents: read
  pull-requests: read

env:
  MYSQL_HOST: 127.0.0.1
  MYSQL_PORT: "43306"
  MYSQL_USER: nearslot
  MYSQL_PASSWORD: ci-mysql-pass
  MYSQL_DATABASE: nearslot
  REDIS_HOST: 127.0.0.1
  REDIS_PASSWORD: ci-redis-pass
  RABBITMQ_HOST: 127.0.0.1
  RABBITMQ_USER: nearslot
  RABBITMQ_PASSWORD: ci-rabbit-pass
  JWT_SECRET: ci-jwt-secret-at-least-32-bytes-long-0123456789

# docs/ 是独立私有仓库（NearSlot-docs），不在本仓库内；文档门禁由 .husky/pre-commit 承担。
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - name: 源码完整性门禁（防 .gitignore 误伤 Java 包路径）
        run: |
          ignored=$(git status --ignored --porcelain=v1 | grep -E '^!! .*/src/.*\.java$' || true)
          if [ -n "$ignored" ]; then
            echo "::error::以下源码被 .gitignore 忽略，CI/他人无法编译："; echo "$ignored"; exit 1
          fi
          echo "源码完整性 OK：src 下没有 .java 被忽略"
      - name: 编译 + 单测（排除 integration 标签）
        run: mvn -B compile test -DexcludedGroups=integration
      - name: 覆盖率门槛（G4：行覆盖 >= 80%）
        run: |
          python3 - <<'PY'
          import csv, glob, os, sys
          tot=[0,0]; br=[0,0]
          for f in glob.glob('*/target/site/jacoco/jacoco.csv'):
              with open(f, encoding='utf-8') as fh:
                  for r in csv.DictReader(fh):
                      tot[0]+=int(r['LINE_COVERED']); tot[1]+=int(r['LINE_COVERED'])+int(r['LINE_MISSED'])
                      br[0]+=int(r['BRANCH_COVERED']); br[1]+=int(r['BRANCH_COVERED'])+int(r['BRANCH_MISSED'])
          line = 0 if tot[1]==0 else round(100*tot[0]/tot[1],1)
          print(f"合计行覆盖 {line}% ({tot[0]}/{tot[1]})")
          if line < 80.0:
              print(f"::error::行覆盖率 {line}% 低于 G4 门槛 80%"); sys.exit(1)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as s:
              s.write(f"## 覆盖率\n\n行覆盖 **{line}%**（{tot[0]}/{tot[1]}）\n")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: jacoco-reports, path: '*/target/site/jacoco/', retention-days: 7 }

  contract:
    needs: [build]
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env: { MYSQL_ROOT_PASSWORD: ci-root-pass, MYSQL_DATABASE: nearslot, MYSQL_USER: nearslot, MYSQL_PASSWORD: ci-mysql-pass }
        ports: ["43306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pci-root-pass"
          --health-interval 10s --health-timeout 5s --health-retries 20
      rabbitmq:
        image: rabbitmq:3.13-alpine
        env: { RABBITMQ_DEFAULT_USER: nearslot, RABBITMQ_DEFAULT_PASS: ci-rabbit-pass }
        ports: ["45672:5672"]
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 15s --health-timeout 10s --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: 启动 Redis（带密码）
        run: |
          docker run -d --name ci-redis -p 46379:6379 redis:7-alpine redis-server --requirepass "$REDIS_PASSWORD"
          for _ in $(seq 1 60); do
            if docker exec ci-redis redis-cli -a "$REDIS_PASSWORD" ping 2>/dev/null | grep -q PONG; then echo redis-ready; break; fi
            sleep 1
          done
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - name: 初始化数据库
        run: |
          for f in $(find sql -maxdepth 1 -name '*.sql' | sort); do
            echo "apply $f"; mysql -h127.0.0.1 -P43306 -uroot -pci-root-pass < "$f"
          done
      - name: 启动应用生成 OpenAPI
        run: |
          mvn -B -q -DskipTests package
          java -jar nearslot-app/target/nearslot-app-*.jar --spring.profiles.active=verify > /tmp/app.log 2>&1 &
          timeout 180 bash -c 'until curl -sf http://localhost:8081/v3/api-docs -o /tmp/openapi.json; do sleep 2; done' || true
          if [ ! -s /tmp/openapi.json ]; then echo "::error::应用未启动"; tail -50 /tmp/app.log; exit 1; fi
          mkdir -p api
          python3 -c "import json;d=json.load(open('/tmp/openapi.json'));json.dump(d,open('api/openapi.json','w'),ensure_ascii=False,indent=2,sort_keys=True)"
      - name: 破坏性变更检测
        run: |
          if git cat-file -e HEAD:api/openapi.json 2>/dev/null; then
            python3 - <<'PY'
          import json, subprocess, sys
          old = json.loads(subprocess.run(['git','show','HEAD:api/openapi.json'], capture_output=True, text=True).stdout or '{}')
          new = json.load(open('api/openapi.json'))
          breaking = []
          for path, methods in (old.get('paths') or {}).items():
              if path not in (new.get('paths') or {}): breaking.append(f"删除路径 {path}"); continue
              for m in methods:
                  if m not in new['paths'][path]: breaking.append(f"删除方法 {m.upper()} {path}")
          if breaking:
              print("检测到破坏性变更，必须升 /api/v{N+1}：")
              for b in breaking: print(" -", b)
              sys.exit(1)
          print("契约变更非破坏性")
          PY
          else
            echo "首次生成 api/openapi.json（基线）"
          fi
      - name: 契约需随 PR 入库
        run: |
          git add api/openapi.json
          if ! git diff --cached --quiet; then
            echo "::error::契约有变更，请随本 PR 提交 api/openapi.json（只打印不失败 = 假门禁）"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: openapi-generated
          path: api/openapi.json
          retention-days: 3
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: app-log-contract, path: /tmp/app.log, retention-days: 3 }

  integration:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env: { MYSQL_ROOT_PASSWORD: ci-root-pass, MYSQL_DATABASE: nearslot, MYSQL_USER: nearslot, MYSQL_PASSWORD: ci-mysql-pass }
        ports: ["43306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pci-root-pass"
          --health-interval 10s --health-timeout 5s --health-retries 20
      rabbitmq:
        image: rabbitmq:3.13-alpine
        env: { RABBITMQ_DEFAULT_USER: nearslot, RABBITMQ_DEFAULT_PASS: ci-rabbit-pass }
        ports: ["45672:5672"]
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 15s --health-timeout 10s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: 启动 Redis（带密码）
        run: |
          docker run -d --name ci-redis -p 46379:6379 redis:7-alpine redis-server --requirepass "$REDIS_PASSWORD"
          for _ in $(seq 1 60); do
            if docker exec ci-redis redis-cli -a "$REDIS_PASSWORD" ping 2>/dev/null | grep -q PONG; then echo redis-ready; break; fi
            sleep 1
          done
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - name: 初始化数据库
        run: |
          for f in $(find sql -maxdepth 1 -name '*.sql' | sort); do
            echo "apply $f"; mysql -h127.0.0.1 -P43306 -uroot -pci-root-pass < "$f"
          done
      - name: 集成测试（真实中间件）
        run: |
          # 评审 BLOCKER-1：-Dgroups 单独不够（pom 默认排除 integration），
          # 必须用 -Pintegration（profile 里 combine.self="override" 清空排除项）。
          mvn -B -Pintegration verify \
            -Dnearslot.test.redis.host=127.0.0.1 \
            -Dnearslot.test.redis.port=46379 \
            -Dnearslot.test.redis.password=ci-redis-pass
          # 0 用例必须失败：防止"过滤条件为空 -> 0 tests 却 BUILD SUCCESS"的假门禁
          count=$(find . -path '*/surefire-reports/*.txt' -exec grep -h 'Tests run:' {} + | awk -F'[:,]' '{s+=$2} END {print s+0}')
          echo "集成用例执行数：$count"
          if [ "$count" -lt 1 ]; then
            echo "::error::集成测试执行了 0 个用例（假门禁）"; exit 1
          fi

  build-image:
    needs: [build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "镜像构建占位（BL-DEP-01）"

  notify:
    needs: [build, contract]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: echo "webhook 通知占位（未配置则跳过）"
