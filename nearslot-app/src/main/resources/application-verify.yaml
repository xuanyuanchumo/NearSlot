spring:
  application:
    name: nearslot
  data:
    redis:
      host: localhost
      port: 46379
      password: ${REDIS_PASSWORD:}
  datasource:
    # NON_KEYWORDS=USER：user 是 H2 保留字，需显式放行（生产 MySQL 无此问题）
    url: jdbc:h2:mem:nearslot;MODE=MySQL;DB_CLOSE_DELAY=-1;NON_KEYWORDS=USER
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  sql:
    init:
      mode: always
      schema-locations: classpath:verify-schema.sql
  rabbitmq:
    host: localhost
    port: 45672
    username: ${RABBITMQ_USER:nearslot}
    password: ${RABBITMQ_PASSWORD:}
    connection-timeout: 3s
    listener:
      simple:
        missing-queues-fatal: false

server:
  port: 48081

# 本地验证默认不起 RabbitMQ：关闭失效广播消费者，改用本地降级 + TTL
# （实测：MQ 缺失时 @RabbitListener 每 5s 重连刷 ERROR 日志）
nearslot:
  mq:
    # 本地已起 RabbitMQ 时开启，用于验证真实广播链路
    invalidation-enabled: ${MQ_INVALIDATION_ENABLED:false}
  admin:
    token: ""

knife4j:
  enable: true
  setting:
    language: zh_cn

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  packages-to-scan: org.nearslot
