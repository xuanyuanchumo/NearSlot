spring:
  application:
    name: nearslot
  data:
    redis:
      host: localhost
      port: 46379
      password: ${REDIS_PASSWORD:}
  datasource:
    # 与 dev 一致使用 MySQL（业务库统一 MySQL，H2 已彻底移除）
    url: jdbc:mysql://localhost:43306/nearslot?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${MYSQL_USER:nearslot}
    password: ${MYSQL_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  rabbitmq:
    host: localhost
    port: 45672
    username: ${RABBITMQ_USER:nearslot}
    password: ${RABBITMQ_PASSWORD:}
    connection-timeout: 3s
    listener:
      simple:
        missing-queues-fatal: false

server:
  # 与 dev profile、vite 代理、nginx upstream 统一为 8081
  port: 8081

nearslot:
  mq:
    # 本地已起 RabbitMQ 时开启，用于验证真实广播链路
    invalidation-enabled: ${MQ_INVALIDATION_ENABLED:false}
  admin:
    token: ""

knife4j:
  enable: true
  setting:
    language: zh_cn

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  packages-to-scan: org.nearslot
