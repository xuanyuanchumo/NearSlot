spring:
  datasource:
    url: jdbc:mysql://localhost:43306/nearslot?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${MYSQL_USER:nearslot}
    password: ${MYSQL_PASSWORD:}
  data:
    redis:
      host: localhost
      port: 46379
      password: ${REDIS_PASSWORD:}
  rabbitmq:
    host: localhost
    port: 45672
    username: ${RABBITMQ_USER:nearslot}
    password: ${RABBITMQ_PASSWORD:}

server:
  port: 8081

knife4j:
  enable: true
  setting:
    language: zh_cn
springdoc:
  api-docs:
    path: /v3/api-docs
  packages-to-scan: org.nearslot
