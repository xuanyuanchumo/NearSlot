spring:
  application:
    name: nearslot
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  # Spring AI 自动配置：未配置 spring.ai.openai.api-key 时排除，避免启动即失败
  # （agent 模块骨架不依赖 LLM 即可运行；正式接入时移除本段并配置 Key）
  autoconfigure:
    exclude:
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiChatAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiModerationAutoConfiguration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      password: ${REDIS_PASSWORD:}
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:3306/${MYSQL_DATABASE:nearslot}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER:nearslot}
    password: ${MYSQL_PASSWORD:}
server:
  port: 8081
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
# Knife4j Next（ADR-018）：/doc.html 增强 UI，/v3/api-docs 契约 JSON
knife4j:
  enable: true
  setting:
    language: zh_cn
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  packages-to-scan: org.nearslot

logging:
  level:
    org.nearslot: ${LOG_LEVEL_MODULE:INFO}
